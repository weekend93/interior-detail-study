<?xml version="1.0" encoding="UTF-8"?>
<svg width="840" height="600" viewBox="0 0 840 600"
     xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, sans-serif">

  <defs>
    <!-- ── HAND-DRAWN FILTER ── -->
    <!-- Applied to drawing elements only; text stays clean -->
    <filter id="sketch" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.06"
                    numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Slightly stronger wobble for the fill layers -->
    <filter id="sketch-fill" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025 0.07"
                    numOctaves="3" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Mortar 45° diagonal hatch -->
    <pattern id="hatch-mortar" width="4" height="4" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#888" stroke-width="0.65"/>
    </pattern>

    <!-- Concrete cross-hatch -->
    <pattern id="hatch-concrete" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#777" stroke-width="0.6"/>
      <line x1="6" y1="0" x2="0" y2="6" stroke="#777" stroke-width="0.6"/>
    </pattern>

    <!-- Stone — fine 135° hatch (light) -->
    <pattern id="hatch-stone" width="3" height="3" patternUnits="userSpaceOnUse"
             patternTransform="rotate(135)">
      <line x1="0" y1="0" x2="0" y2="3" stroke="#bbb" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- White background -->
  <rect width="840" height="600" fill="white"/>

  <!-- ═══════════════════════════════════════════════
       SCALE: 1/10  (1mm real = 1.2px in SVG)
       Drawing area: x=160~560  FL±0: y=200
         Stone FIN. 20mm = 24px  y=200~224
         Mortar     80mm = 96px  y=224~320
         Slab             50px   y=320~370
  ═══════════════════════════════════════════════ -->

  <!-- ══════════════════════════════════
       SECTION FILLS  (sketch-fill filter)
  ══════════════════════════════════ -->
  <g filter="url(#sketch-fill)">
    <!-- Stone fill -->
    <rect x="160" y="200" width="400" height="24" fill="url(#hatch-stone)"/>
    <!-- Mortar fill -->
    <rect x="160" y="224" width="400" height="96" fill="url(#hatch-mortar)"/>
    <!-- Existing slab fill -->
    <rect x="160" y="320" width="400" height="50" fill="url(#hatch-concrete)"/>
  </g>

  <!-- ══════════════════════════════════
       SECTION LINES  (sketch filter — wobbly edges)
  ══════════════════════════════════ -->
  <g filter="url(#sketch)" stroke-linecap="round">

    <!-- Top FL line (bold) -->
    <path d="M158,200 C230,199 310,201 390,200 C460,199 520,200 562,200"
          stroke="#111" stroke-width="2" fill="none"/>
    <!-- Stone / mortar boundary -->
    <path d="M159,224 C240,223 330,225 420,224 C490,223 540,224 561,224"
          stroke="#555" stroke-width="0.9" fill="none"/>
    <!-- Mortar / slab boundary (bold) -->
    <path d="M158,320 C230,319 320,321 410,320 C490,319 540,320 562,320"
          stroke="#111" stroke-width="2" fill="none"/>

    <!-- Left & right walls -->
    <path d="M160,199 C159,240 161,280 160,321"
          stroke="#111" stroke-width="1.3" fill="none"/>
    <path d="M560,199 C561,245 559,278 560,321"
          stroke="#111" stroke-width="1.3" fill="none"/>

    <!-- Slab side edges -->
    <path d="M160,319 C159,340 161,358 160,371"
          stroke="#555" stroke-width="0.9" fill="none"/>
    <path d="M560,319 C561,338 559,356 560,371"
          stroke="#555" stroke-width="0.9" fill="none"/>

    <!-- Wavy bottom of slab -->
    <path d="M160,370 C175,368 183,374 200,370 C217,366 225,373 242,370
             C258,367 267,374 283,370 C299,367 308,373 325,370
             C341,367 350,374 366,370 C382,367 391,373 408,370
             C424,367 433,374 450,370 C466,367 475,373 492,370
             C508,367 517,374 534,370 C548,367 555,372 560,370"
          stroke="#555" stroke-width="1" fill="none"/>

    <!-- Break marks -->
    <line x1="160" y1="370" x2="142" y2="392" stroke="#555" stroke-width="0.9"/>
    <line x1="150" y1="370" x2="132" y2="392" stroke="#555" stroke-width="0.9"/>
    <line x1="560" y1="370" x2="578" y2="392" stroke="#555" stroke-width="0.9"/>
    <line x1="570" y1="370" x2="588" y2="392" stroke="#555" stroke-width="0.9"/>

    <!-- ── DIMENSION LINES (left) ── -->

    <!-- Outer 100mm — x=60 -->
    <path d="M160,200 C120,200 80,200 54,200" stroke="#333" stroke-width="0.7" fill="none"/>
    <path d="M160,320 C120,320 80,320 54,320" stroke="#333" stroke-width="0.7" fill="none"/>
    <path d="M60,200 C60,240 60,280 60,320"   stroke="#333" stroke-width="0.9" fill="none"/>
    <!-- Tick marks -->
    <line x1="54" y1="194" x2="66" y2="206" stroke="#333" stroke-width="1.6"/>
    <line x1="54" y1="314" x2="66" y2="326" stroke="#333" stroke-width="1.6"/>

    <!-- Inner 20mm — x=85 -->
    <path d="M160,200 C130,200 100,200 78,200" stroke="#333" stroke-width="0.6" fill="none"/>
    <path d="M160,224 C130,224 100,224 78,224" stroke="#333" stroke-width="0.6" fill="none"/>
    <path d="M84,200 C84,208 84,216 84,224"   stroke="#333" stroke-width="0.8" fill="none"/>
    <line x1="78" y1="194" x2="90" y2="206" stroke="#333" stroke-width="1.5"/>
    <line x1="78" y1="218" x2="90" y2="230" stroke="#333" stroke-width="1.5"/>

    <!-- Inner 80mm — x=85 -->
    <path d="M160,224 C130,224 100,224 78,224" stroke="#333" stroke-width="0.6" fill="none"/>
    <path d="M160,320 C130,320 100,320 78,320" stroke="#333" stroke-width="0.6" fill="none"/>
    <path d="M84,224 C84,260 84,290 84,320"   stroke="#333" stroke-width="0.8" fill="none"/>
    <line x1="78" y1="218" x2="90" y2="230" stroke="#333" stroke-width="1.5"/>
    <line x1="78" y1="314" x2="90" y2="326" stroke="#333" stroke-width="1.5"/>

    <!-- ── LEADER LINE (right) ── -->
    <path d="M560,212 C585,225 615,248 640,268" stroke="#333" stroke-width="0.8" fill="none"/>
    <polygon points="560,212 568,206 567,218" fill="#333"/>
    <line x1="640" y1="265" x2="640" y2="287" stroke="#333" stroke-width="0.8"/>
    <line x1="640" y1="265" x2="660" y2="265" stroke="#333" stroke-width="0.8"/>
    <line x1="640" y1="285" x2="660" y2="285" stroke="#333" stroke-width="0.8"/>
  </g>

  <!-- FL±0 marker (no filter — keep crisp) -->
  <polygon points="348,200 340,187 356,187" fill="#111"/>

  <!-- ══════════════════════════════════
       TEXT — NO FILTER (stays readable)
  ══════════════════════════════════ -->
  <text x="360" y="195" font-size="11" font-weight="bold" fill="#111">FL±0</text>

  <!-- Dimension numbers -->
  <text transform="translate(52,261) rotate(-90)"
        text-anchor="middle" font-size="11" fill="#333">100</text>
  <text transform="translate(77,213) rotate(-90)"
        text-anchor="middle" font-size="9"  fill="#333">20</text>
  <text transform="translate(77,273) rotate(-90)"
        text-anchor="middle" font-size="9"  fill="#333">80</text>

  <!-- Leader labels -->
  <text x="664" y="269" font-size="10" fill="#111">APP' STONE FIN.</text>
  <text x="664" y="289" font-size="10" fill="#111">MORTAR (WIRE MESH)</text>

  <!-- ══════════════════════════════════
       TITLE BLOCK (clean, no filter)
  ══════════════════════════════════ -->
  <rect x="120" y="470" width="480" height="70"
        fill="none" stroke="#333" stroke-width="0.8"/>
  <line x1="210" y1="470" x2="210" y2="540" stroke="#333" stroke-width="0.7"/>
  <line x1="390" y1="470" x2="390" y2="540" stroke="#333" stroke-width="0.7"/>
  <line x1="120" y1="505" x2="600" y2="505" stroke="#333" stroke-width="0.7"/>

  <text x="165" y="491" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">F-002</text>
  <text x="300" y="491" text-anchor="middle" font-size="10" fill="#333">FINISH</text>
  <text x="495" y="491" text-anchor="middle" font-size="10" fill="#333">STONE</text>
  <text x="165" y="527" text-anchor="middle" font-size="10" fill="#777">FD-002</text>
  <text x="300" y="527" text-anchor="middle" font-size="10" fill="#333">DISCRIPTION</text>
  <text x="495" y="527" text-anchor="middle" font-size="9"  fill="#777">—</text>

  <!-- ══════════════════════════════════
       OUTER BORDER & TITLE
  ══════════════════════════════════ -->
  <rect x="10" y="10" width="820" height="580"
        fill="none" stroke="#555" stroke-width="0.8"/>
  <text x="420" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">
    바닥상세도 -2 / FLOOR DETAIL -2
  </text>
  <text x="420" y="63" text-anchor="middle" font-size="9" fill="#777">
    SCALE : A3 1/10    DATE : 2025. 04.    DRAWING NO. : FD-002    SHEET NO. : 003
  </text>
  <line x1="10" y1="72" x2="830" y2="72" stroke="#555" stroke-width="0.7"/>

</svg>
