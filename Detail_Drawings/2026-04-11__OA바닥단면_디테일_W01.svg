    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="4"
                    result="noise" seed="9"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Lighter wobble for annotations/dims -->
    <filter id="rough-sm" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3"
                    result="noise" seed="9"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"
                         xChannelSelector="R" yChannelSelector="G"/>
