<?xml version="1.0" encoding="UTF-8"?>
<svg width="750" height="1050" viewBox="0 0 750 1050"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Courier New', Courier, monospace">

  <defs>
    <!-- Hand-drawn wobble filter -->
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" seed="7"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Graph paper: fine 10px grid -->
    <pattern id="grid-fine" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0L0 0 0 10" fill="none" stroke="#9ab4d0" stroke-width="0.3" opacity="0.55"/>
    </pattern>

    <!-- Graph paper: major 50px grid -->
    <pattern id="grid-major" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0L0 0 0 50" fill="none" stroke="#6080a8" stroke-width="0.65" opacity="0.45"/>
    </pattern>

    <!-- Concrete diagonal hatching -->
    <pattern id="hatch-rc" width="10" height="10" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#444" stroke-width="0.9" opacity="0.5"/>
    </pattern>

    <!-- Arrow marker: red -->
    <marker id="arr-red" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#cc0000"/>
    </marker>
    <marker id="arr-red-rev" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#cc0000"/>
    </marker>
    <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2244bb"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2244bb"/>
    </marker>
  </defs>

  <!-- ── BACKGROUND ──────────────────────────────────────── -->
  <rect width="750" height="1050" fill="#f9f7f1"/>
  <rect width="750" height="1050" fill="url(#grid-fine)"/>
  <rect width="750" height="1050" fill="url(#grid-major)"/>

  <!-- Outer border -->
  <rect x="22" y="22" width="706" height="1006" fill="none"
        stroke="#555" stroke-width="2" filter="url(#rough)"/>

