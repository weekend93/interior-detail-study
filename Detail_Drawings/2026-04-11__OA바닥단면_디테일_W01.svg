  <circle cx="476" cy="230" r="4" fill="#555" filter="url(#rough)"/>
  <circle cx="524" cy="230" r="4" fill="#555" filter="url(#rough)"/>
  <rect x="492" y="238" width="16" height="112" fill="#ececec"
