    <!-- Graph paper fine -->
    <pattern id="gf" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0L0 0 0 10" fill="none" stroke="#9ab4d0" stroke-width="0.25" opacity="0.5"/>
    </pattern>
    <!-- Graph paper major -->
    <pattern id="gm" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0L0 0 0 50" fill="none" stroke="#6080a8" stroke-width="0.6" opacity="0.4"/>
    </pattern>
    <!-- Concrete hatching -->
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#555" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

