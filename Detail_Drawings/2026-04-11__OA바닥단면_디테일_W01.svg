  <rect x="22" y="22" width="706" height="58" fill="none"
        stroke="#555" stroke-width="1.2" filter="url(#rough)"/>
  <line x1="22" y1="22" x2="728" y2="22" stroke="#555" stroke-width="2.5"/>

  <text x="375" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">
    OA 바닥 단면 디테일 / OA FLOOR SECTION DETAIL
  </text>
  <text x="375" y="68" text-anchor="middle" font-size="9.5" fill="#555">
